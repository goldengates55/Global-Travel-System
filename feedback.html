<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4a1388">
<title>Your feedback</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--paper:#ece3fa;--ink:#10042a;--mute:#3f3260;--line:#9d88cc;--stamp:#4a1388;--card:#fff;--shadow:0 1px 2px rgba(16,4,42,.06),0 8px 24px -10px rgba(16,4,42,.18)}
@media (prefers-color-scheme:dark){:root{--paper:#150336;--ink:#ffffff;--mute:#d6c9f0;--line:#7a55c2;--stamp:#ffd21e;--card:#2e0f68;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 48px}header{display:flex;align-items:center;gap:10px;margin-bottom:16px}header b{flex:1;font-size:1.15rem}
button{font:600 1rem system-ui,sans-serif;border-radius:14px;padding:13px 16px;border:1px solid var(--stamp);background:var(--card);color:var(--stamp);cursor:pointer}
button.pri{background:var(--stamp);color:var(--paper);width:100%;margin-top:12px}#lang{border-radius:999px;padding:8px 14px;font-size:.9rem;border-color:var(--line);color:var(--ink)}
h1{font-size:1.5rem;line-height:1.2;margin:0 0 8px}.m{color:var(--mute);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.rate{display:flex;gap:8px;margin:12px 0}.rate button{flex:1;padding:14px 0;font-size:1.15rem}.rate button.on{background:var(--stamp);color:var(--paper)}
textarea{width:100%;min-height:76px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;margin:6px 0 12px}
label.ck{display:flex;gap:10px;align-items:flex-start}label.ck input{width:20px;height:20px;margin-top:3px}
</style>
</head>
<body>
<main>
<header><b id="biz">Your feedback</b><button id="lang" type="button">Français</button></header>
<div id="app"></div>
</main>
<script>
(function(){
var D=null,L="en",R=0;
try{var h=location.hash.replace(/^#p=/,"").replace(/-/g,"+").replace(/_/g,"/");while(h.length%4)h+="=";D=JSON.parse(decodeURIComponent(escape(atob(h))));if(!D||D.v!==1||typeof D!=="object")D=null}catch(e){D=null}
if(D&&D.lg==="fr")L="fr";
function el(t,x,c){var e=document.createElement(t);if(x!==undefined)e.textContent=x;if(c)e.className=c;return e}

var wi=null,wn=null,okc=null;
function render(){
  var app=document.getElementById("app");app.innerHTML="";document.documentElement.lang=L;document.getElementById("lang").textContent=L==="fr"?"English":"Français";
  if(!D){app.appendChild(el("h1",T("This link is not valid","Ce lien n’est pas valide")));app.appendChild(el("p",T("Please ask your agent to send it again.","Demandez à votre agent de le renvoyer."),"m"));return}
  var ag=D.ag||{};document.getElementById("biz").textContent=String(ag.b||"Global Visa").slice(0,80);document.title=T("Your feedback","Votre avis");
  app.appendChild(el("h1",T("How was our service"+(D.n?", "+String(D.n).slice(0,30):"")+"?","Comment s’est passé notre service"+(D.n?", "+String(D.n).slice(0,30):"")+" ?")));
  app.appendChild(el("p",T("Your honest answer helps us improve. It takes one minute and nothing is stored on this page.","Votre réponse honnête nous aide à progresser. Cela prend une minute et rien n’est enregistré sur cette page."),"m"));
  var c=el("section",undefined,"card");c.appendChild(el("p",T("Your rating (1 = poor, 5 = excellent)","Votre note (1 = mauvais, 5 = excellent)")));
  var rt=el("div",undefined,"rate");[1,2,3,4,5].forEach(function(n){var b=el("button",String(n));b.type="button";if(R===n)b.className="on";b.addEventListener("click",function(){R=n;render()});rt.appendChild(b)});c.appendChild(rt);
  c.appendChild(el("label",T("What went well?","Qu’est-ce qui s’est bien passé ?")));var a=el("textarea");a.maxLength=400;a.value=W1;a.addEventListener("input",function(){W1=a.value});c.appendChild(a);
  c.appendChild(el("label",T("What could be better?","Qu’est-ce qui pourrait être mieux ?")));var b2=el("textarea");b2.maxLength=400;b2.value=W2;b2.addEventListener("input",function(){W2=b2.value});c.appendChild(b2);
  var lb=el("label",undefined,"ck"),cb=el("input");cb.type="checkbox";cb.checked=OK;cb.addEventListener("change",function(){OK=cb.checked});lb.appendChild(cb);lb.appendChild(el("span",T("You may share my comment as a review (without my full name).","Vous pouvez publier mon commentaire comme avis (sans mon nom complet).")));c.appendChild(lb);
  var s=el("button",T("Send to my agent on WhatsApp","Envoyer à mon agent sur WhatsApp"),"pri");s.type="button";
  s.addEventListener("click",function(){if(!R){alert(T("Please choose a rating first.","Choisissez d’abord une note."));return}
    var w=String(ag.w||"").replace(/\D/g,"");if(!w){alert(T("No agent number on this page.","Aucun numéro d’agent sur cette page."));return}
    var t=T("Hello, my feedback: "+R+"/5.","Bonjour, mon avis : "+R+"/5.")+(W1?"\n"+T("Went well: ","Bien passé : ")+W1:"")+(W2?"\n"+T("Could be better: ","À améliorer : ")+W2:"")+"\n"+(OK?T("You may share my comment as a review.","Vous pouvez publier mon commentaire."):T("Please keep my comment private.","Merci de garder mon commentaire privé."));
    window.open("https://wa.me/"+w+"?text="+encodeURIComponent(t),"_blank","noopener")});
  c.appendChild(s);app.appendChild(c);
  if(R>=4)app.appendChild(el("p",T("Thank you! If a friend needs help with a visa, please tell them about us.","Merci ! Si un ami a besoin d’aide pour un visa, parlez-lui de nous."),"m"));
}
var W1="",W2="",OK=false;function keep(){}
document.getElementById("lang").addEventListener("click",function(){L=L==="fr"?"en":"fr";render()});
render();
})();
</script>
</body>
</html>
