<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ece3fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#150336" media="(prefers-color-scheme: dark)">
<title>Visa application details</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#ece3fa;--ink:#10042a;--mute:#3f3260;--line:#9d88cc;--stamp:#4a1388;--card:#fff;--bad:#c4421f;--shadow:0 1px 2px rgba(16,4,42,.06),0 8px 24px -10px rgba(16,4,42,.18)}
@media (prefers-color-scheme:dark){:root{--paper:#150336;--ink:#ffffff;--mute:#d6c9f0;--line:#7a55c2;--stamp:#ffd21e;--card:#2e0f68;--bad:#ff8f66;--shadow:0 10px 28px -10px rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,color-mix(in srgb,var(--stamp) 10%,var(--paper)),var(--paper) 320px) no-repeat,var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.gv{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--stamp);color:var(--paper);font:800 .9rem/1 "Bricolage Grotesque",system-ui,sans-serif}
header b{font:800 1.2rem/1 "Bricolage Grotesque",system-ui,sans-serif;flex:1}
#lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .9rem "Instrument Sans",system-ui,sans-serif;cursor:pointer}
h1{font:700 clamp(1.7rem,7vw,2.2rem)/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.015em;margin:0 0 8px}
p{margin:0 0 14px}.m{color:var(--mute);font-size:.9rem}
form{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:600}
label small{font-weight:400;color:var(--mute)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--stamp);box-shadow:0 0 0 4px color-mix(in srgb,var(--stamp) 20%,transparent)}
.warn{border-left:5px solid var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--card));border-radius:14px;padding:12px 14px;font-size:.92rem}
button.go,button.alt{font:600 1rem "Instrument Sans",system-ui,sans-serif;border-radius:13px;min-height:46px;padding:11px 18px;cursor:pointer;border:1px solid var(--stamp)}
button.go{background:var(--stamp);color:var(--paper)}
button.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
#err{color:var(--bad);font-weight:600;min-height:1.2em}
#done{display:none}
pre{white-space:pre-wrap;word-break:break-word;background:color-mix(in srgb,var(--stamp) 7%,var(--card));border:1px solid var(--line);border-radius:14px;padding:12px;font:.82rem/1.45 ui-monospace,Menlo,monospace;max-height:220px;overflow:auto}
</style>
</head>
<body>
<main>
<header><span class="gv">GV</span><b id="brand">Global Visa</b><button type="button" id="lang"></button></header>
<h1 id="h"></h1>
<p id="intro"></p>
<form id="f" novalidate>
<div class="warn" id="warn"></div>
<label><span id="l-n"></span><input id="n" type="text" maxlength="80" autocomplete="name"></label>
<label><span id="l-p"></span><input id="p" type="tel" maxlength="30" autocomplete="tel" inputmode="tel"><small id="h-p"></small></label>
<label><span id="l-d"></span><select id="d"></select></label>
<label><span id="l-t"></span><select id="t"></select></label>
<label><span id="l-tr"></span><input id="tr" type="date"></label>
<label><span id="l-nt"></span><textarea id="nt" maxlength="300"></textarea></label>
<div id="err" role="alert"></div>
<div class="row"><button class="go" type="submit" id="send"></button></div>
<p class="m" id="priv"></p>
</form>
<section id="done">
<h1 id="dh"></h1>
<p id="dp"></p>
<pre id="msg"></pre>
<div class="row"><button class="go" type="button" id="share"></button><button class="alt" type="button" id="copy"></button></div>
</section>
</main>
<script src="live.js"></script>
<script>
(function(){
var Q=new URLSearchParams(location.search);
var to=(Q.get("to")||"").replace(/\D/g,"").slice(0,15),biz=(Q.get("biz")||"").slice(0,80);
var LVC=null;try{var lr=Q.get("lv");if(lr){var lb=lr.replace(/-/g,"+").replace(/_/g,"/");while(lb.length%4)lb+="=";LVC=LV.cfg({lv:JSON.parse(atob(lb))})}}catch(e){LVC=null}
var DEST=[["schengen","Schengen area","Espace Schengen"],["uk","United Kingdom","Royaume-Uni"],["usa","United States","États-Unis"],["canada","Canada","Canada"],["australia","Australia","Australie"],["other","Other","Autre"]];
var TYPE=[["tourist","Tourist","Tourisme"],["business","Business","Affaires"],["student","Study","Études"],["immigration","Immigration (permanent residence)","Immigration (résidence permanente)"],["family","Family visit","Visite familiale"],["transit","Transit","Transit"]];
var S={
 en:{title:"Visa application details",h:"Tell us about your visa application",intro:"Fill in this short form. It opens WhatsApp with your details ready to send to",introNo:"Fill in this short form. You will get a message to send to your visa agent.",
  warn:"Do not enter passport numbers, card numbers or PINs. Your agent will ask for documents separately.",
  n:"Full name",p:"WhatsApp number",hp:"With country code, for example +237 6XX XX XX XX",d:"Where do you want to travel?",t:"Why are you travelling?",tr:"Planned travel date (optional)",nt:"Anything else we should know? (optional)",
  send:"Send my details",e1:"Please enter your full name.",e2:"Please enter a valid WhatsApp number.",
  priv:"This page does not send anything to a server. Your details go only to your agent, through WhatsApp.",
  dh:"Your details are ready",dp:"Send this message to your agent. If WhatsApp did not open, tap Share or Copy.",share:"Send on WhatsApp",copy:"Copy details",copied:"Copied",ok1:"Your details were sent",ok2:"Your agent received them online and will contact you. You can also send them on WhatsApp if you like.",priv2:"Your details are sent to your agent’s online inbox. Anyone at the agency who handles your file can read them.",sending:"Sending…",
  hd:"Global Visa client details",ln:"Name",lp:"WhatsApp",ld:"Destination",lt:"Visa type",ltr:"Travel date",lnt:"Notes",other:"Français"},
 fr:{title:"Détails de votre demande de visa",h:"Parlez-nous de votre demande de visa",intro:"Remplissez ce court formulaire. Il ouvre WhatsApp avec vos informations prêtes à envoyer à",introNo:"Remplissez ce court formulaire. Vous obtiendrez un message à envoyer à votre agent visa.",
  warn:"N’indiquez ni numéro de passeport, ni numéro de carte, ni code PIN. Votre agent vous demandera les documents séparément.",
  n:"Nom complet",p:"Numéro WhatsApp",hp:"Avec l’indicatif du pays, par exemple +237 6XX XX XX XX",d:"Où voulez-vous voyager ?",t:"Pourquoi voyagez-vous ?",tr:"Date de voyage prévue (facultatif)",nt:"Autre chose à savoir ? (facultatif)",
  send:"Envoyer mes informations",e1:"Veuillez entrer votre nom complet.",e2:"Veuillez entrer un numéro WhatsApp valide.",
  priv:"Cette page n’envoie rien à un serveur. Vos informations vont uniquement à votre agent, par WhatsApp.",
  dh:"Vos informations sont prêtes",dp:"Envoyez ce message à votre agent. Si WhatsApp ne s’est pas ouvert, touchez Partager ou Copier.",share:"Envoyer sur WhatsApp",copy:"Copier",copied:"Copié",ok1:"Vos informations ont été envoyées",ok2:"Votre agent les a reçues en ligne et vous contactera. Vous pouvez aussi les envoyer par WhatsApp si vous le souhaitez.",priv2:"Vos informations sont envoyées dans la boîte en ligne de votre agent. Les personnes de l’agence qui traitent votre dossier peuvent les lire.",sending:"Envoi…",
  hd:"Informations client Global Visa",ln:"Nom",lp:"WhatsApp",ld:"Destination",lt:"Type de visa",ltr:"Date de voyage",lnt:"Notes",other:"English"}
};
var L=(Q.get("l")||(navigator.language||"en")).slice(0,2)==="fr"?"fr":"en";
function $(i){return document.getElementById(i)}
function fill(sel,list){var v=sel.value;sel.innerHTML="";list.forEach(function(x){var o=document.createElement("option");o.value=x[0];o.textContent=L==="fr"?x[2]:x[1];sel.appendChild(o)});if(v)sel.value=v}
function ui(){
  var s=S[L];document.documentElement.lang=L;document.title=s.title;
  $("h").textContent=s.h;$("warn").textContent=s.warn;$("priv").textContent=LVC?s.priv2:s.priv;
  $("intro").textContent=biz?s.intro+" "+biz+".":s.introNo;
  [["n","n"],["p","p"],["d","d"],["t","t"],["tr","tr"],["nt","nt"]].forEach(function(x){$("l-"+x[0]).textContent=s[x[1]]});
  $("h-p").textContent=s.hp;$("send").textContent=s.send;$("lang").textContent=s.other;
  $("dh").textContent=s.dh;$("dp").textContent=s.dp;$("share").textContent=to?s.share:s.share;$("copy").textContent=s.copy;
  fill($("d"),DEST);fill($("t"),TYPE);
  if(biz)$("brand").textContent=biz;
}
function lab(list,k){for(var i=0;i<list.length;i++)if(list[i][0]===k)return L==="fr"?list[i][2]:list[i][1];return k}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
var text="";
$("lang").addEventListener("click",function(){L=L==="fr"?"en":"fr";ui()});
$("f").addEventListener("submit",function(e){
  e.preventDefault();var s=S[L],n=$("n").value.trim(),p=$("p").value.trim();
  if(!n){$("err").textContent=s.e1;$("n").focus();return}
  if(p.replace(/\D/g,"").length<7){$("err").textContent=s.e2;$("p").focus();return}
  $("err").textContent="";
  var o={v:1,n:n.slice(0,80),p:p.slice(0,30),d:$("d").value,t:$("t").value,tr:$("tr").value||"",nt:$("nt").value.trim().slice(0,300)};
  var lines=[s.hd,"",s.ln+": "+o.n,s.lp+": "+o.p,s.ld+": "+lab(DEST,o.d),s.lt+": "+lab(TYPE,o.t)];
  if(o.tr)lines.push(s.ltr+": "+o.tr);
  if(o.nt)lines.push(s.lnt+": "+o.nt);
  lines.push("","GVI1:"+enc(o));
  text=lines.join("\n");
  function show(online){
  if(online){$("dh").textContent=s.ok1;$("dp").textContent=s.ok2;$("msg").style.display="none";$("copy").style.display="none";if(!to)$("share").style.display="none"}
  $("msg").textContent=text;$("f").style.display="none";$("intro").style.display="none";$("h").style.display="none";$("done").style.display="block";window.scrollTo(0,0);
  if(!online&&to)window.open("https://wa.me/"+to+"?text="+encodeURIComponent(text),"_blank");
  }
  if(LVC){var sb=$("send");sb.disabled=true;sb.textContent=s.sending;
    LV.add(LVC,"enquiries",LV.rnd(20),{n:o.n,ph:o.p,d:o.d,t:o.t,tr:o.tr,nt:o.nt,at:Date.now()}).then(function(ok){sb.disabled=false;sb.textContent=s.send;show(!!ok)});
  }else show(false);
});
$("share").addEventListener("click",function(){
  if(to){window.open("https://wa.me/"+to+"?text="+encodeURIComponent(text),"_blank");return}
  if(navigator.share){navigator.share({text:text}).catch(function(){})}else{window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank")}
});
$("copy").addEventListener("click",function(){
  var b=$("copy"),s=S[L];
  function ok(){b.textContent=s.copied;setTimeout(function(){b.textContent=s.copy},1800)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,function(){})}
  else{var r=document.createRange();r.selectNodeContents($("msg"));var sl=getSelection();sl.removeAllRanges();sl.addRange(r);try{document.execCommand("copy");ok()}catch(x){}}
});
ui();
})();
</script>
</body>
</html>
