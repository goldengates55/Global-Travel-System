<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4a1388">
<title>Interview practice</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--paper:#ece3fa;--ink:#10042a;--mute:#3f3260;--line:#9d88cc;--stamp:#4a1388;--ok:#1a7f3c;--card:#fff;--bad:#c4421f;--shadow:0 1px 2px rgba(16,4,42,.06),0 8px 24px -10px rgba(16,4,42,.18)}
@media (prefers-color-scheme:dark){:root{--paper:#150336;--ink:#ffffff;--mute:#d6c9f0;--line:#7a55c2;--stamp:#ffd21e;--ok:#5fdc8b;--card:#2e0f68;--bad:#ff8f66;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
header b{font-size:1.15rem;flex:1}
button,.btn{font:600 1rem system-ui,sans-serif;border-radius:14px;padding:13px 16px;border:1px solid var(--stamp);background:var(--card);color:var(--stamp);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.pri,.btn.pri{background:var(--stamp);color:var(--paper)}
#lang{border-radius:999px;padding:8px 14px;font-size:.9rem;border-color:var(--line);color:var(--ink)}
h1{font-size:1.6rem;line-height:1.15;margin:0 0 6px}
h2{font-size:1.2rem;line-height:1.3;margin:0 0 10px}
.m{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:0 0 14px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1;min-width:130px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 14px}.bar span{display:block;height:100%;background:var(--stamp)}
.tip{background:var(--paper);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.95rem}
ul{margin:6px 0 0;padding-left:20px}
</style>
</head>
<body>
<main>
<header><b id="biz">Interview practice</b><button id="lang" type="button">Français</button></header>
<div id="app"></div>
<p class="m" id="foot"></p>
</main>
<script>
(function(){
var PQ={"tourist": [["Why do you want to visit this country?", "Pourquoi voulez-vous visiter ce pays ?", "One clear purpose that matches your itinerary and bookings.", "Un objectif clair qui correspond à votre itinéraire et à vos réservations."], ["How long will you stay, and where?", "Combien de temps resterez-vous, et où ?", "Give exact dates and places. They must match your hotel or host details.", "Donnez des dates et lieux exacts, identiques à votre hôtel ou à votre hôte."], ["Who is paying for the trip?", "Qui paie le voyage ?", "Say who. Be ready to show proof: your statements, or a sponsor letter with their statements.", "Dites qui. Soyez prêt à le prouver : vos relevés, ou une lettre du sponsor avec ses relevés."], ["What work do you do?", "Quel travail faites-vous ?", "Job title, employer, how long, and the dates of your leave. It must match your job letter.", "Poste, employeur, ancienneté et dates de congé, conformes à votre attestation de travail."], ["Why will you come back home?", "Pourquoi reviendrez-vous chez vous ?", "Concrete ties: job, family, property, studies. Not just “because I love my country”.", "Des attaches concrètes : emploi, famille, biens, études. Pas seulement « parce que j’aime mon pays »."], ["Have you travelled before, or been refused a visa?", "Avez-vous déjà voyagé ou essuyé un refus de visa ?", "Always tell the truth. The embassy can see past records.", "Dites toujours la vérité. L’ambassade peut voir vos antécédents."], ["How much money do you have for the trip?", "De quelle somme disposez-vous pour le voyage ?", "Know the number. It must be close to your bank statements.", "Connaissez le montant. Il doit être proche de vos relevés bancaires."]], "student": [["Why do you want to study this course?", "Pourquoi voulez-vous suivre cette formation ?", "Link the course to your past studies and your career plan.", "Reliez la formation à vos études passées et à votre projet de carrière."], ["Why this school and this country?", "Pourquoi cette école et ce pays ?", "Name two real reasons: the programme, the teachers, the results. Not only “it is cheaper”.", "Donnez deux vraies raisons : le programme, les enseignants, les résultats. Pas seulement « c’est moins cher »."], ["Who will pay your tuition and living costs?", "Qui paiera vos frais de scolarité et de vie ?", "Name the payer and show proof. A sponsor must be able to explain their income.", "Nommez le payeur et prouvez-le. Un sponsor doit pouvoir expliquer ses revenus."], ["What did you study before, and what were your results?", "Qu’avez-vous étudié avant et avec quels résultats ?", "Know your diplomas, years and grades. They must match your documents.", "Connaissez vos diplômes, années et notes, conformes à vos documents."], ["Where will you live?", "Où habiterez-vous ?", "Give the address or the type of housing you booked.", "Donnez l’adresse ou le type de logement réservé."], ["What will you do after your studies?", "Que ferez-vous après vos études ?", "A believable plan that fits your field. Do not promise to stay for ever, and do not say you will break the rules.", "Un projet crédible dans votre domaine. Ne promettez pas de rester pour toujours et ne dites jamais que vous enfreindrez les règles."]], "work": [["Why do you want to live and work in this place?", "Pourquoi voulez-vous vivre et travailler à cet endroit ?", "Give real reasons about the community, work and language, from your own research.", "Donnez de vraies raisons sur la communauté, le travail et la langue, issues de vos recherches."], ["Tell me about the job offer or your plan to find work.", "Parlez-moi de l’offre d’emploi ou de votre plan pour trouver du travail.", "Employer, role, pay and start date. Never claim a job you do not have.", "Employeur, poste, salaire et date de début. Ne prétendez jamais avoir un emploi que vous n’avez pas."], ["What is your level of English or French?", "Quel est votre niveau d’anglais ou de français ?", "Know your test result and date. Speak clearly and calmly.", "Connaissez votre résultat de test et sa date. Parlez clairement et calmement."], ["What work experience and education do you have?", "Quelle expérience et quelle formation avez-vous ?", "Years, duties and diplomas that match your letters and credentials.", "Années, tâches et diplômes conformes à vos lettres et titres."], ["How will you support your family when you arrive?", "Comment subviendrez-vous aux besoins de votre famille à l’arrivée ?", "Know your settlement funds and where the money comes from.", "Connaissez vos fonds d’établissement et leur origine."], ["Did anyone promise you a job or approval for money?", "Quelqu’un vous a-t-il promis un emploi ou une approbation contre de l’argent ?", "Be honest. Paying for job offers or approvals is a sign of fraud and can end your application.", "Soyez honnête. Payer pour une offre d’emploi ou une approbation est un signe de fraude et peut mettre fin à la demande."]], "family": [["Who are you visiting, and how are you related?", "Qui visitez-vous et quel est votre lien ?", "Name, relationship and the host’s status in the country. Match the invitation letter.", "Nom, lien et statut de l’hôte dans le pays, conformes à la lettre d’invitation."], ["When did you last see this person?", "Quand avez-vous vu cette personne pour la dernière fois ?", "Give a true date and context. Photos or messages can support it.", "Donnez une date et un contexte vrais. Des photos ou messages peuvent l’appuyer."], ["Where will you stay and for how long?", "Où logerez-vous et combien de temps ?", "Address of the host and exact dates.", "Adresse de l’hôte et dates exactes."], ["Who pays for the trip?", "Qui paie le voyage ?", "You or the host. Show proof from the one who pays.", "Vous ou l’hôte. Prouvez-le avec les documents du payeur."], ["What will make you return home?", "Qu’est-ce qui vous fera revenir chez vous ?", "Job, family, property, studies. Concrete, not vague.", "Emploi, famille, biens, études. Du concret, pas du vague."]]};
var D=null,L="en",ORDER=[],N=0,SHOW=false,BAD=[];
try{var h=location.hash.replace(/^#p=/,"").replace(/-/g,"+").replace(/_/g,"/");while(h.length%4)h+="=";D=JSON.parse(decodeURIComponent(escape(atob(h))));if(!D||D.v!==1||typeof D!=="object"||!PQ[D.t])D=null}catch(e){D=null}
if(D&&D.lg==="fr")L="fr";
function el(t,x,c){var e=document.createElement(t);if(x!==undefined)e.textContent=x;if(c)e.className=c;return e}
function T(a,b){return L==="fr"?b:a}
function pick(x){return Array.isArray(x)?(L==="fr"?x[1]:x[0])||x[0]||"":String(x||"")}
function btn(t,f,c){var b=el("button",t,c);b.type="button";b.addEventListener("click",f);return b}
function shuffle(n){var a=[];for(var i=0;i<n;i++)a.push(i);for(var i2=n-1;i2>0;i2--){var j=Math.floor(Math.random()*(i2+1)),t=a[i2];a[i2]=a[j];a[j]=t}return a}
function wa(text){var n=String((D.ag&&D.ag.w)||"").replace(/\D/g,"");return "https://wa.me/"+n+"?text="+encodeURIComponent(text)}
function render(){
  document.documentElement.lang=L;document.getElementById("lang").textContent=L==="fr"?"English":"Français";
  var app=document.getElementById("app");app.innerHTML="";
  if(!D){app.appendChild(el("h1",T("This link is not valid","Ce lien n’est pas valide")));app.appendChild(el("p",T("Please ask your agent to send you the link again.","Demandez à votre agent de vous renvoyer le lien."),"m"));return}
  var ag=D.ag||{};document.getElementById("biz").textContent=String(ag.b||"Global Visa").slice(0,80);document.title=T("Interview practice","Entraînement à l’entretien");
  var qs=PQ[D.t],tot=Math.min(qs.length,10);
  if(!ORDER.length)ORDER=shuffle(qs.length).slice(0,tot);
  if(N===0&&!SHOW&&!app.__started&&!window.__go){
    app.appendChild(el("h1",T("Practice your visa interview","Entraînez-vous à l’entretien de visa")));
    app.appendChild(el("p",pick(D.tl||"")+(D.n?" · "+String(D.n).slice(0,40):""),"m"));
    var c0=el("section",undefined,"card");
    c0.appendChild(el("p",T("You will see "+tot+" questions that are often asked. Say your answer out loud, then look at the tip. Answer truthfully and simply, in your own words.","Vous verrez "+tot+" questions souvent posées. Répondez à voix haute, puis lisez le conseil. Répondez avec sincérité et simplicité, avec vos propres mots.")));
    c0.appendChild(el("p",T("This is practice only. The real questions can be different. Nothing you do here is saved or sent anywhere.","C’est un simple entraînement. Les vraies questions peuvent être différentes. Rien de ce que vous faites ici n’est enregistré ni envoyé.") ,"m"));
    c0.appendChild(btn(T("Start","Commencer"),function(){window.__go=1;render()},"pri"));app.appendChild(c0);return}
  if(N>=tot){
    app.appendChild(el("h1",T("Well done","Bravo")));
    var c1=el("section",undefined,"card");
    c1.appendChild(el("p",T("You went through "+tot+" questions. "+(tot-BAD.length)+" feel ready.","Vous avez passé "+tot+" questions. "+(tot-BAD.length)+" vous semblent prêtes.")));
    if(BAD.length){c1.appendChild(el("p",T("Practise these again:","À retravailler :")));var ul=el("ul");BAD.forEach(function(i){ul.appendChild(el("li",pick(qs[i])))});c1.appendChild(ul)}
    var r=el("div",undefined,"row");
    r.appendChild(btn(T("Practise again","Recommencer"),function(){ORDER=[];N=0;SHOW=false;BAD=[];render()}));
    if(ag.w){var a=el("a",T("Tell my agent","Écrire à mon agent"),"btn pri");a.target="_blank";a.rel="noopener";a.href=wa(T("Hello, I practised my visa interview. "+(tot-BAD.length)+" of "+tot+" questions feel ready."+(BAD.length?" I want to practise more on: "+BAD.map(function(i){return qs[i][0]}).join(" / "):""),"Bonjour, j’ai fait l’entraînement à l’entretien de visa. "+(tot-BAD.length)+" questions sur "+tot+" me semblent prêtes."+(BAD.length?" Je veux encore m’entraîner sur : "+BAD.map(function(i){return qs[i][1]}).join(" / "):"")));r.appendChild(a)}
    c1.appendChild(r);app.appendChild(c1);return}
  var q=qs[ORDER[N]],bar=el("div",undefined,"bar");bar.appendChild(el("span"));bar.firstChild.style.width=Math.round(N/tot*100)+"%";app.appendChild(bar);
  var c=el("section",undefined,"card");c.appendChild(el("p",T("Question "+(N+1)+" of "+tot,"Question "+(N+1)+" sur "+tot),"m"));c.appendChild(el("h2",L==="fr"?q[1]:q[0]));
  if(!SHOW){c.appendChild(btn(T("Show the tip","Voir le conseil"),function(){SHOW=true;render()},"pri"))}
  else{c.appendChild(el("div",L==="fr"?q[3]:q[2],"tip"));c.appendChild(el("p",T("How did it feel?","Comment était-ce ?"),"m"));
    var r2=el("div",undefined,"row");r2.appendChild(btn(T("Ready","Prêt(e)"),function(){N++;SHOW=false;render()},"pri"));r2.appendChild(btn(T("Practise again","À retravailler"),function(){BAD.push(ORDER[N]);N++;SHOW=false;render()}));c.appendChild(r2)}
  app.appendChild(c);
}
document.getElementById("lang").addEventListener("click",function(){L=L==="fr"?"en":"fr";render()});
render();
})();
</script>
</body>
</html>
