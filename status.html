<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a6f66">
<title>Your visa file</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--paper:#eef2f1;--ink:#0f2429;--mute:#51666b;--line:#d3dfdc;--stamp:#0a6f66;--ok:#1a7f3c;--card:#fff;--bad:#c4421f;--shadow:0 1px 2px rgba(15,36,41,.06),0 8px 24px -10px rgba(15,36,41,.18)}
@media (prefers-color-scheme:dark){:root{--paper:#08171a;--ink:#e6f2f0;--mute:#93aeb0;--line:#1f3b40;--stamp:#5ad6c3;--ok:#5fdc8b;--card:#0f2428;--bad:#ff8f66;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
header b{font-size:1.15rem;flex:1}
#lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .9rem system-ui,sans-serif;cursor:pointer}
h1{font-size:1.7rem;line-height:1.15;margin:0 0 6px}
h2{font-size:1.05rem;margin:0 0 10px}
.m{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:0 0 14px;box-shadow:var(--shadow)}
ol{list-style:none;margin:0;padding:0}
li.st{display:flex;gap:12px;align-items:center;padding:7px 0;color:var(--mute)}
li.st i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:.75rem;color:#fff}
li.st.done{color:var(--ink)}li.st.done i{background:var(--ok);border-color:var(--ok)}
li.st.now{color:var(--ink);font-weight:700}li.st.now i{border-color:var(--stamp);background:var(--stamp)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.bar span{display:block;height:100%;background:var(--stamp)}
ul{margin:6px 0 0;padding-left:20px}
.pill{display:inline-block;border-radius:99px;padding:4px 12px;font-weight:700;font-size:.9rem;background:var(--stamp);color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns a{flex:1;text-align:center;text-decoration:none;font-weight:700;padding:12px 14px;border-radius:14px;border:1px solid var(--stamp);color:var(--stamp);min-width:140px}
</style>
</head>
<body>
<main>
<header><b id="biz">Global Visa</b><button id="lang" type="button">Français</button></header>
<div id="app"></div>
<p class="m" id="foot"></p>
</main>
<script>
(function(){
var ST=[["new","New","Nouveau"],["docs","Collecting documents","Collecte des documents"],["ready","Ready to submit","Prêt à déposer"],["appt","Appointment booked","Rendez-vous pris"],["sent","Submitted","Déposé"],["decision","Decision received","Décision reçue"],["passport","Passport ready","Passeport prêt"]];
var D=null,L="en";
try{var h=location.hash.replace(/^#s=/,"").replace(/-/g,"+").replace(/_/g,"/");while(h.length%4)h+="=";D=JSON.parse(decodeURIComponent(escape(atob(h))));if(!D||D.v!==1||typeof D!=="object")D=null}catch(e){D=null}
if(D&&D.lg==="fr")L="fr";
function el(t,x,c){var e=document.createElement(t);if(x!==undefined)e.textContent=x;if(c)e.className=c;return e}
function T(a,b){return L==="fr"?b:a}
function pick(x){return Array.isArray(x)?(L==="fr"?x[1]:x[0])||x[0]||"":String(x||"")}
function fdate(v){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||"");if(!m)return "";return new Date(Date.UTC(+m[1],m[2]-1,+m[3])).toLocaleDateString(L==="fr"?"fr-FR":"en-GB",{timeZone:"UTC",weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function money(n,c){try{return new Intl.NumberFormat(L==="fr"?"fr-FR":"en-GB",{maximumFractionDigits:2}).format(n)+" "+c}catch(e){return n+" "+c}}
function render(){
  document.documentElement.lang=L;document.getElementById("lang").textContent=L==="fr"?"English":"Français";
  var app=document.getElementById("app");app.innerHTML="";
  if(!D){app.appendChild(el("h1",T("This link is not valid","Ce lien n’est pas valide")));app.appendChild(el("p",T("Please ask your agent to send you the link again.","Demandez à votre agent de vous renvoyer le lien."),"m"));return}
  var ag=D.ag||{};document.getElementById("biz").textContent=String(ag.b||"Global Visa").slice(0,80);document.title=T("Your visa file","Votre dossier de visa");
  app.appendChild(el("h1",T("Hello ","Bonjour ")+String(D.n||"").slice(0,60)));
  app.appendChild(el("p",pick(D.dst)+" · "+pick(D.ty),"m"));
  var c1=el("section",undefined,"card");c1.appendChild(el("h2",T("Where your file stands","Où en est votre dossier")));
  var ol=el("ol"),idx=-1;ST.forEach(function(s,i){if(s[0]===D.k)idx=i});if(D.k==="closed")idx=ST.length;
  ST.forEach(function(s,i){var li=el("li",undefined,"st"+(i<idx?" done":i===idx?" now":""));li.appendChild(el("i",i<idx?"✓":""));li.appendChild(el("span",L==="fr"?s[2]:s[1]));ol.appendChild(li)});
  c1.appendChild(ol);
  if(D.r==="approved")c1.appendChild(el("p",T("Decision: approved.","Décision : accordé."),"pill"));
  else if(D.r==="refused")c1.appendChild(el("p",T("Decision: refused. Your agent will explain the next steps.","Décision : refusé. Votre agent vous expliquera la suite."),"m"));
  app.appendChild(c1);
  if(D.nx&&pick(D.nx)){var cn=el("section",undefined,"card");cn.appendChild(el("h2",T("What happens next","Et ensuite")));cn.appendChild(el("p",pick(D.nx).slice(0,400)));app.appendChild(cn)}
  if(D.a){var c2=el("section",undefined,"card");c2.appendChild(el("h2",T("Your appointment","Votre rendez-vous")));c2.appendChild(el("p",fdate(D.a)||""));if(Array.isArray(D.ap)){if(D.ap[1])c2.appendChild(el("p",T("Arrive at ","Arrivez à ")+String(D.ap[1]).slice(0,40),"m"));if(D.ap[0])c2.appendChild(el("p",String(D.ap[0]).slice(0,200),"m"))}app.appendChild(c2)}
  var dn=D.dn||[0,0],c3=el("section",undefined,"card");c3.appendChild(el("h2",T("Your documents","Vos documents")));
  c3.appendChild(el("p",dn[0]+" / "+dn[1]+T(" received"," reçus"),"m"));
  var bar=el("div",undefined,"bar"),sp=el("span");sp.style.width=(dn[1]?Math.round(dn[0]/dn[1]*100):0)+"%";bar.appendChild(sp);c3.appendChild(bar);
  var ms=Array.isArray(D.m)?D.m.slice(0,30):[];
  if(ms.length){c3.appendChild(el("p",T("We still need:","Il nous manque encore :")));var ul=el("ul");ms.forEach(function(x){ul.appendChild(el("li",pick(x)))});c3.appendChild(ul)}
  else if(dn[1])c3.appendChild(el("p",T("Nothing is missing. Thank you.","Rien ne manque. Merci.")));
  app.appendChild(c3);
  if(D.b>0){var c4=el("section",undefined,"card");c4.appendChild(el("h2",T("Balance to pay","Solde à payer")));c4.appendChild(el("p",money(D.b,String(D.bc||"XAF").slice(0,5))));app.appendChild(c4)}
  var bt=el("div",undefined,"btns"),w=String(ag.w||"").replace(/\D/g,"");
  if(w){var a=el("a",T("Message us on WhatsApp","Écrivez-nous sur WhatsApp"));a.href="https://wa.me/"+w;a.rel="noopener";bt.appendChild(a)}
  if(/^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(ag.e||"")){var e=el("a",T("Send an email","Envoyer un e-mail"));e.href="mailto:"+ag.e;bt.appendChild(e)}
  if(bt.children.length)app.appendChild(bt);
  document.getElementById("foot").textContent=T("Updated on ","Mis à jour le ")+(D.u||"")+T(". This page is a snapshot. Ask your agent for a new link to see changes.",". Cette page est un instantané. Demandez un nouveau lien à votre agent pour voir les changements.");
}
document.getElementById("lang").addEventListener("click",function(){L=L==="fr"?"en":"fr";render()});
render();
})();
</script>
</body>
</html>
